name: Deploy to Azure Ubuntu VM

# Requires repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# See docs/DEPLOY_AZURE_UBUNTU.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure-ubuntu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: /srv/skanaround
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, build and restart on the VM
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash $APP_DIR/deploy/wsl/deploy.sh main $APP_DIR"
