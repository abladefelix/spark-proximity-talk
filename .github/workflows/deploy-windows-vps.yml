name: Deploy to VPS (WSL)

# Requires a self-hosted GitHub Actions runner installed on the Windows VPS with
# the labels [self-hosted, windows, skanaround]. The runner shells into WSL and
# runs the Linux deploy script. See docs/DEPLOY_WINDOWS_VPS.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-wsl
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, skanaround]
    env:
      WSL_DISTRO: Ubuntu
      APP_DIR: /srv/skanaround
    steps:
      - name: Pull, build and restart inside WSL
        shell: pwsh
        run: |
          wsl -d $env:WSL_DISTRO -- bash -lc "bash $env:APP_DIR/deploy/wsl/deploy.sh main $env:APP_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh WSL port forwarding
        shell: pwsh
        run: |
          & "$PWD\deploy\windows\wsl-portproxy.ps1" -Distro $env:WSL_DISTRO
