name: Deploy to Windows VPS

# Requires a self-hosted GitHub Actions runner installed on the VPS with the
# labels [self-hosted, windows, skanaround]. See docs/DEPLOY_WINDOWS_VPS.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-windows-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, skanaround]
    env:
      APP_DIR: C:\apps\skanaround
    steps:
      - name: Pull, build and restart
        shell: pwsh
        run: |
          & "$env:APP_DIR\deploy\windows\deploy.ps1" -AppDir "$env:APP_DIR" -Branch main
